name: Deploy production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  BACKEND_HOST: 46.149.71.147
  FRONTEND_HOST: 186.246.10.163
  SSH_USER: root
  FLUTTER_VERSION: 3.38.5

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30

    steps:
      - name: Require a main-branch dispatch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Production can only be deployed from main." >&2
          exit 1

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Flutter
        if: inputs.target == 'all' || inputs.target == 'frontend'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create public production config
        if: inputs.target == 'all' || inputs.target == 'frontend'
        shell: bash
        run: |
          printf '%s\n' \
            'GPM_APP_MODE=production' \
            'GPM_APP_API_URL=https://app-api.gpmbot.ru' \
            > .env

      - name: Validate and build frontend
        if: inputs.target == 'all' || inputs.target == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build web --release --base-href /
          flutter build web --release --target lib/registration_preview_main.dart --base-href /registration-preview/ --output build/registration-preview
          cp -a build/registration-preview build/web/registration-preview
          test -f build/web/registration-preview/index.html
          test -f build/web/registration-preview/main.dart.js
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/assets/.env
          test -f build/web/assets/assets/images/gpm_logo.png
          test -f build/web/assets/assets/images/gpm_logo_refined.png
          tar -C build/web -czf "/tmp/gpm-web-${GITHUB_SHA}.tar.gz" .

      - name: Validate backend
        if: inputs.target == 'all' || inputs.target == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            -r requirements-api.lock pip-audit==2.10.1
          python3 -m pip check
          python3 -m pip_audit -r requirements-api.lock
          python3 -m compileall -q app main.py tests
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        if: inputs.target == 'all' || inputs.target == 'backend'
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${BACKEND_HOST}" \
            "DEPLOY_SHA='${GITHUB_SHA}' bash -se" <<'REMOTE'
          set -euo pipefail

          cd /opt/gpm/gpm_platform

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Backend repository has tracked local changes; deployment stopped." >&2
            exit 1
          fi

          STAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="/opt/gpm/backups/$STAMP"
          VENV_ROOT=/opt/gpm/venvs
          NEW_VENV="$VENV_ROOT/gpm-app-${DEPLOY_SHA}"
          mkdir -p "$BACKUP_DIR"
          mkdir -p "$VENV_ROOT"
          OLD_BACKEND_SHA=$(git rev-parse HEAD)
          OLD_VENV_KIND=directory
          OLD_VENV_TARGET=""
          VENV_SWITCHED=0
          if [ -L .venv ]; then
            OLD_VENV_KIND=symlink
            OLD_VENV_TARGET=$(readlink -f .venv)
          fi
          printf '%s\n' "$OLD_BACKEND_SHA" > "$BACKUP_DIR/commit-before-deploy.txt"
          git bundle create "$BACKUP_DIR/repository-before-deploy.bundle" HEAD

          git fetch origin main
          test "$(git rev-parse origin/main)" = "${DEPLOY_SHA}"
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git merge --ff-only "$DEPLOY_SHA"

          rollback_backend() {
            status=$?
            if [ "$status" -eq 0 ]; then status=1; fi
            trap - ERR TERM HUP
            echo "Backend deployment failed; restoring $OLD_BACKEND_SHA." >&2
            git reset --hard "$OLD_BACKEND_SHA"
            if [ "$VENV_SWITCHED" -eq 1 ]; then
              unlink .venv
              if [ "$OLD_VENV_KIND" = symlink ]; then
                ln -s "$OLD_VENV_TARGET" .venv
              else
                mv "$BACKUP_DIR/venv-before-deploy" .venv
              fi
            fi
            systemctl restart gpm-app-api.service
            exit "$status"
          }
          trap rollback_backend ERR TERM HUP

          grep -Fxq 'GPM_APP_ENV=production' /root/gpm-app-env
          grep -Eq '^GPM_APP_ALLOWED_ORIGINS=.*https://app\.gpmbot\.ru' /root/gpm-app-env
          grep -Eq '^GPM_APP_ALLOWED_ORIGINS=.*http://localhost:8090' /root/gpm-app-env
          grep -Eq '^GPM_APP_ALLOWED_ORIGINS=.*http://127\.0\.0\.1:8090' /root/gpm-app-env
          if grep -Eq '^GPM_APP_(USERNAME|PASSWORD|ROLE)=' /root/gpm-app-env; then
            echo "Legacy shared app credentials must be removed before deployment." >&2
            false
          fi

          if [ ! -x "$NEW_VENV/bin/python" ]; then
            python3 -m venv "$NEW_VENV"
          fi
          "$NEW_VENV/bin/python" -m pip install --disable-pip-version-check \
            --upgrade pip
          "$NEW_VENV/bin/python" -m pip install --disable-pip-version-check \
            -r requirements-api.lock
          "$NEW_VENV/bin/python" -m pip check
          "$NEW_VENV/bin/python" -m compileall -q app main.py tests
          "$NEW_VENV/bin/python" -m unittest discover -s tests -p 'test_*.py'
          set -a
          . /root/gpm-app-env
          set +a
          "$NEW_VENV/bin/python" -c 'import app.app_orders_api as api; api.validate_runtime_configuration(); api.validate_account_source_configuration(); import fastapi, psycopg2, uvicorn, yaml'

          # The registration laboratory uses its own private SQLite directory.
          # Prepare only that new path for the existing runtime user; do not alter
          # service accounts, the production database or application authentication.
          PREVIEW_DIR=/opt/gpm/gpm_platform/.registration_preview_private
          test ! -L "$PREVIEW_DIR"
          API_USER=$(systemctl show -p User --value gpm-app-api.service)
          API_USER=${API_USER:-root}
          API_GROUP=$(id -gn "$API_USER")
          if [ ! -d "$PREVIEW_DIR" ]; then
            install -d -m 700 -o "$API_USER" -g "$API_GROUP" "$PREVIEW_DIR"
          fi
          test "$(stat -c %U "$PREVIEW_DIR")" = "$API_USER"
          test "$(stat -c %a "$PREVIEW_DIR")" = 700

          # One-time-per-account backfill: assigns L#/C# actor codes (used by
          # the new order-numbering scheme) to any logist/client account that
          # doesn't have one yet, ordered by registration date. Idempotent
          # (get-or-assign), so safe to run on every deploy — cheap relative
          # to deploy frequency, and acts as an ongoing safety net.
          "$NEW_VENV/bin/python" -m app.backfill_actor_codes

          if [ "$OLD_VENV_KIND" = directory ]; then
            mv .venv "$BACKUP_DIR/venv-before-deploy"
          else
            unlink .venv
          fi
          ln -s "$NEW_VENV" .venv
          VENV_SWITCHED=1

          systemctl restart gpm-app-api.service

          for attempt in $(seq 1 15); do
            health_response=""
            if [ "$(systemctl is-active gpm-app-api.service)" = active ]; then
              health_response=$(curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 10 \
                https://app-api.gpmbot.ru/health || true)
            fi
            if [ -n "$health_response" ] && \
               printf '%s' "$health_response" \
                 | python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("status") == "ok" and data.get("storage") == "postgres" else 1)'; then
              trap - ERR TERM HUP
              git rev-parse --short HEAD
              echo "Backend deployment completed. Backup: $BACKUP_DIR"
              exit 0
            fi
            sleep 2
          done

          echo "Backend health check failed. Backup: $BACKUP_DIR" >&2
          journalctl -u gpm-app-api.service -n 80 --no-pager >&2
          # Trigger ERR so rollback_backend restores the previous revision.
          false
          REMOTE
      - name: Upload frontend artifact
        if: inputs.target == 'all' || inputs.target == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/gpm-web-${GITHUB_SHA}.tar.gz"
          EXPECTED_SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          # Probe command access before transferring. SFTP is also exercised by
          # the verified daily frontend backup; raw SSH stdin can stall here.
          timeout 45 ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${FRONTEND_HOST}" \
            'test -d /var/www/gpm-app; df -Pk /tmp /var/www; printf "Frontend SSH ready\n"'
          timeout 180 scp -q -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$ARCHIVE" "${SSH_USER}@${FRONTEND_HOST}:${ARCHIVE}.partial"
          timeout 45 ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${FRONTEND_HOST}" \
            "set -eu; printf '%s  %s\n' '$EXPECTED_SHA' '${ARCHIVE}.partial' | sha256sum --check --status; chmod 600 '${ARCHIVE}.partial'; mv '${ARCHIVE}.partial' '$ARCHIVE'; printf 'Frontend artifact SHA256 verified\n'"

      - name: Deploy frontend atomically
        if: inputs.target == 'all' || inputs.target == 'frontend'
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${FRONTEND_HOST}" \
            "ARCHIVE='/tmp/gpm-web-${GITHUB_SHA}.tar.gz' bash -se" <<'REMOTE'
          set -euo pipefail

          STAMP=$(date +%Y%m%d_%H%M%S)
          LIVE=/var/www/gpm-app
          STAGE="/var/www/gpm-app-stage-$STAMP"
          PREVIOUS="/var/www/gpm-app-previous-$STAMP"
          FAILED="/var/www/gpm-app-failed-$STAMP"
          BACKUP_DIR="/opt/gpm/front-backups/$STAMP"
          SWAPPED=0

          rollback() {
            status=$?
            if [ "$status" -eq 0 ]; then status=1; fi
            trap - ERR TERM HUP
            if [ "$SWAPPED" -eq 1 ] && [ -d "$PREVIOUS" ]; then
              echo "Frontend verification failed; restoring previous version." >&2
              mv "$LIVE" "$FAILED"
              mv "$PREVIOUS" "$LIVE"
              nginx -t
              systemctl reload nginx
            fi
            exit "$status"
          }
          trap rollback ERR TERM HUP

          mkdir -p "$STAGE" "$BACKUP_DIR"
          tar -xzf "$ARCHIVE" -C "$STAGE"

          test -f "$STAGE/registration-preview/index.html"
          test -f "$STAGE/registration-preview/main.dart.js"
          test -f "$STAGE/index.html"
          test -f "$STAGE/main.dart.js"
          test -f "$STAGE/assets/.env"
          test -f "$STAGE/assets/assets/images/gpm_logo.png"
          test -f "$STAGE/assets/assets/images/gpm_logo_refined.png"
          grep -Fxq 'GPM_APP_MODE=production' "$STAGE/assets/.env"
          grep -Fxq 'GPM_APP_API_URL=https://app-api.gpmbot.ru' "$STAGE/assets/.env"

          cp -a "$LIVE" "$BACKUP_DIR/gpm-app-before-deploy"
          find "$STAGE" -type d -exec chmod 755 {} \;
          find "$STAGE" -type f -exec chmod 644 {} \;
          chown -R www-data:www-data "$STAGE"

          nginx -t
          mv "$LIVE" "$PREVIOUS"
          mv "$STAGE" "$LIVE"
          SWAPPED=1

          nginx -t
          systemctl reload nginx
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://app.gpmbot.ru/ >/dev/null
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://app.gpmbot.ru/assets/.env \
            | grep -Fq 'GPM_APP_API_URL=https://app-api.gpmbot.ru'

          SWAPPED=0
          trap - ERR TERM HUP
          rm -f "$ARCHIVE"
          echo "Frontend deployment completed. Backup: $BACKUP_DIR"
          echo "Previous version: $PREVIOUS"
          REMOTE
