name: GPM gold design QA
on:
  workflow_dispatch:
  push:
    branches: [work/gpm-helmet-yellow-design-2026-11-23]
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Configure synthetic preview
        run: printf '%s\n' 'GPM_APP_MODE=demo' > .env
      - run: flutter pub get
      - name: Format design sources
        run: |
          dart format test/worker_orders_screen_test.dart test/order_date_filter_screens_test.dart lib/theme/gpm_theme.dart lib/widgets/gpm_bottom_navigation_bar.dart lib/screens/worker/worker_referral_promo.dart test/gpm_gold_design_test.dart
          dart fix --apply --code=curly_braces_in_flow_control_structures
      - run: flutter analyze --no-pub
      - name: Check responsive layout, contrast and existing application flows
        run: flutter test --no-pub test/gpm_gold_design_test.dart test/worker_orders_screen_test.dart test/order_date_filter_screens_test.dart test/worker_dashboard_screen_test.dart test/worker_home_payout_ux_test.dart test/adaptive_buttons_test.dart
      - name: Save reviewed design previews and formatted sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpm-gold-design-review
          path: |
            build/gold-design-shots/*.png
            lib/theme/gpm_theme.dart
            lib/widgets/gpm_bottom_navigation_bar.dart
            lib/screens/worker/worker_referral_promo.dart
            test/gpm_gold_design_test.dart
            test/worker_orders_screen_test.dart
            test/order_date_filter_screens_test.dart
          retention-days: 7
