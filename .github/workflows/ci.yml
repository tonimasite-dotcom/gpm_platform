name: CI

on:
  push:
    branches:
      - qa/worker-rating-v2-2026-11-19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rating-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Prepare synthetic configuration
        run: |
          printf '%s\n' 'GPM_APP_MODE=demo' > .env
          flutter pub get
      - name: Format changed Dart sources
        run: |
          dart format lib/services/gpm_api_service.dart lib/widgets/worker_rating.dart lib/widgets/rating_action_dialog.dart lib/screens/ratings/worker_rating_screen.dart lib/screens/worker/worker_profile_screen.dart lib/screens/logist/worker_profile_review_screen.dart lib/screens/logist/logist_orders_screen.dart lib/screens/client/client_orders_screen.dart test/tester_feedback_api_test.dart test/tester_feedback_test.dart test/logist_workers_screen_test.dart test/worker_rating_v2_test.dart test/worker_rating_api_test.dart test/worker_rating_order_ui_test.dart .tmp/rating_preview_test.dart
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          paths=["lib/services/gpm_api_service.dart","lib/widgets/worker_rating.dart","lib/widgets/rating_action_dialog.dart","lib/screens/ratings/worker_rating_screen.dart","lib/screens/worker/worker_profile_screen.dart","lib/screens/logist/worker_profile_review_screen.dart","lib/screens/logist/logist_orders_screen.dart","lib/screens/client/client_orders_screen.dart","test/tester_feedback_api_test.dart","test/tester_feedback_test.dart","test/logist_workers_screen_test.dart","test/worker_rating_v2_test.dart","test/worker_rating_api_test.dart","test/worker_rating_order_ui_test.dart"]
          Path("rating-format").mkdir()
          manifest={"source_sha":"1bed63508ac7d5b6c2a063639c1b989198e192a2","files":{}}
          with zipfile.ZipFile("rating-format/formatted-sources.zip","w",zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  data=Path(name).read_bytes()
                  manifest["files"][name]=hashlib.sha256(data).hexdigest()
                  z.writestr(name,data)
              z.writestr("manifest.json",json.dumps(manifest))
          PY
      - name: Capture synthetic rating screens
        timeout-minutes: 3
        run: flutter test --no-pub --timeout 120s .tmp/rating_preview_test.dart
      - name: Upload rating previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-rating-previews
          path: rating-previews/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Upload formatted sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-rating-formatted-sources
          path: rating-format/formatted-sources.zip
          retention-days: 7
          if-no-files-found: warn
