name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  referral-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: |
          printf 'GPM_APP_MODE=demo\n' > .env
          flutter pub get
          flutter test --no-pub .tmp/referral_preview_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: referral-previews
          path: referral-previews/*.png
          retention-days: 7
