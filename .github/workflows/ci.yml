name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: gpm_test
          POSTGRES_USER: gpm_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpm_test -d gpm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GPM_TEST_POSTGRES_URL: postgresql://gpm_test:synthetic-test-password@127.0.0.1:5432/gpm_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-api.lock

      - name: Install and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-api.lock pip-audit==2.10.1
          python -m pip check
          python -m pip_audit -r requirements-api.lock

      - name: Test backend
        run: |
          python -m compileall -q app main.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Create synthetic test config
        run: |
          printf '%s\n' 'GPM_APP_MODE=demo' > .env

      - name: Validate Flutter application
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build web --release --base-href /
