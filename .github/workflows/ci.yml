name: CI

on:
  push:
    branches:
      - qa/logist-filter-previews-2026-11-19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Capture synthetic previews
        timeout-minutes: 2
        run: |
          printf '%s\n' 'GPM_APP_MODE=demo' > .env
          flutter pub get
          flutter test --no-pub --timeout 45s .tmp/logist_filter_preview_test.dart
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logist-filter-previews
          path: filter-previews/*.png
          retention-days: 7
          if-no-files-found: warn
