name: Crew attendance schema proposal QA

on:
  workflow_dispatch:
  push:
    branches: [work/gpm-crew-attendance-plan-2026-11-23]

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: crew_proposal
          POSTGRES_USER: proposal_test
          POSTGRES_PASSWORD: synthetic-proposal-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proposal_test -d crew_proposal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GPM_CREW_SCHEMA_TEST_URL: postgresql://proposal_test:synthetic-proposal-password@127.0.0.1:5432/crew_proposal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-api.lock
      - run: python -m pip install --disable-pip-version-check -r requirements-api.lock
      - name: Validate proposal in disposable database only
        run: python plans/crew-attendance/test_schema_proposal.py
