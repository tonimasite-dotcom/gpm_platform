name: Provision owner-approved named logists
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, rehearse with rollback, or create approved accounts
        required: true
        default: inspect
        type: choice
        options: [inspect, rehearse, apply]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure verified GPM SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Process private owner request
        shell: bash
        env:
          APPROVED_REQUEST: ${{ secrets.GPM_APPROVED_LOGISTS_20261124 }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          request=json.loads(os.environ['APPROVED_REQUEST'])
          operation=os.environ['OPERATION']
          assert operation in {'inspect','rehearse','apply'}
          assert request.get('owner_approved') is True
          run_id=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch('[0-9]+-[0-9]+',run_id)
          source=Path('scripts/provision_named_logists.py').read_text()
          compile(source,'<gpm-logist-provision>','exec')
          program=source+'\nexecute('+repr(request)+','+repr(operation)+','+repr(run_id)+')\n'
          shell="set -euo pipefail\ncd /opt/gpm/gpm_platform\ntest ! -L /opt/gpm/gpm_platform\nset -a\n. /root/gpm-app-env\nset +a\n.venv/bin/python - <<'GPM_PROVISION'\n"+program+"\nGPM_PROVISION\n"
          result=subprocess.run(['ssh','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes',
            '-o','IdentitiesOnly=yes','-o','ConnectTimeout=15','-o','ServerAliveInterval=15',
            '-o','ServerAliveCountMax=3','root@46.149.71.147','bash -se'],
            input=shell,text=True,capture_output=True,timeout=180)
          summaries=[]
          for line in result.stdout.splitlines():
            try:
              value=json.loads(line)
              if isinstance(value,dict) and 'ok' in value:summaries.append(value)
            except ValueError:pass
          if result.returncode!=0 or not summaries or not summaries[-1].get('ok'):
            print(json.dumps({'ok':False,'summary':summaries[-1] if summaries else None,'exit_code':result.returncode}))
            raise SystemExit('Private diagnostic retained on GPM backend')
          print(json.dumps(summaries[-1]))
          PY
      - name: Remove runner SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
