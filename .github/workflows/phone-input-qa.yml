name: Unified phone input QA

on:
  push:
    branches: [work/unified-phones-2026-11-24]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-input-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Configure synthetic assets
        run: printf '%s\n' 'GPM_APP_MODE=demo' > .env
      - name: Format and validate phone fields
        run: |
          flutter pub get
          dart format lib/registration/registration_phone_input.dart lib/screens/client/client_profile_screen.dart lib/screens/logist/logist_profile_screen.dart lib/screens/worker/worker_profile_screen.dart lib/registration/registration_preview_screen.dart lib/screens/worker/worker_sbp_payout.dart lib/register_screen.dart lib/auth/bitrix_registration_example.dart lib/client/client_create_order_example.dart test/phone_input_test.dart
          flutter analyze --no-pub
          flutter test --no-pub test/phone_input_test.dart test/registration_preview_screen_test.dart test/registration_preview_api_test.dart test/registration_preview_visual_test.dart test/worker_home_payout_ux_test.dart
      - name: Check unchanged TS matching policy
        run: |
          php integrations/workstaff-test-crm/worker-link/test_phone_formats.php
          php integrations/workstaff-test-crm/worker-link/test_policy.php
          php integrations/workstaff-test-crm/worker-link/test_preview_policy.php
          php integrations/workstaff-test-crm/worker-link/test_preview_service.php
      - name: Store formatted sources and synthetic previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-input-checks
          path: |
            lib/registration/registration_phone_input.dart
            lib/screens/client/client_profile_screen.dart
            lib/screens/logist/logist_profile_screen.dart
            lib/screens/worker/worker_profile_screen.dart
            lib/registration/registration_preview_screen.dart
            lib/screens/worker/worker_sbp_payout.dart
            lib/register_screen.dart
            lib/auth/bitrix_registration_example.dart
            lib/client/client_create_order_example.dart
            test/phone_input_test.dart
            build/registration-preview-shots/*.png
            build/worker-home-payout/*.png
          retention-days: 7
