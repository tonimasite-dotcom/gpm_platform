name: Reset production order data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE ALL GPM ORDER DATA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  BACKEND_HOST: 46.149.71.147
  SSH_USER: root

jobs:
  reset:
    name: Backup and reset order data
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15

    steps:
      - name: Require a main-branch dispatch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Production maintenance can only run from main." >&2
          exit 1

      - name: Require the exact confirmation phrase
        shell: bash
        env:
          RESET_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$RESET_CONFIRMATION" = 'DELETE ALL GPM ORDER DATA'

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Backup and reset only the GPM order domain
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${BACKEND_HOST}" "bash -se" <<'REMOTE'
          set -euo pipefail

          cd /opt/gpm/gpm_platform
          set -a
          . /root/gpm-app-env
          set +a

          test "${GPM_APP_ENV:-}" = production
          test -n "${GPM_APP_DATABASE_URL:-}"
          test -x .venv/bin/python
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null

          STAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="/opt/gpm/backups/order-reset-$STAMP"
          BACKUP_FILE="$BACKUP_DIR/gpm-app-before-order-reset.dump"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"

          DB_URL=${GPM_APP_DATABASE_URL/postgresql+asyncpg:\/\//postgresql:\/\/}
          umask 077
          pg_dump --format=custom --file="$BACKUP_FILE" "$DB_URL"
          test -s "$BACKUP_FILE"
          pg_restore --list "$BACKUP_FILE" >/dev/null

          GPM_RESET_BACKUP_FILE="$BACKUP_FILE" .venv/bin/python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from uuid import uuid4

          import psycopg2

          dsn = os.environ["GPM_APP_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql://", 1
          )
          backup_file = os.environ["GPM_RESET_BACKUP_FILE"]

          order_tables = [
              "gpm_app_chat_reads",
              "gpm_app_chat_messages",
              "gpm_app_chat_threads",
              "gpm_app_attendance_challenges",
              "gpm_app_order_attendance",
              "gpm_app_orders",
              "gpm_app_actor_daily_order_seq",
              "gpm_app_order_number_seq",
          ]
          preserved_tables = [
              "gpm_app_accounts",
              "gpm_app_profiles",
              "gpm_app_sessions",
              "gpm_app_account_invitations",
              "gpm_app_worker_verifications",
              "gpm_app_account_actor_codes",
              "gpm_app_actor_code_seq",
          ]

          connection = psycopg2.connect(dsn)
          try:
              connection.set_session(isolation_level="REPEATABLE READ")
              with connection:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          "LOCK TABLE "
                          + ", ".join(order_tables)
                          + " IN ACCESS EXCLUSIVE MODE"
                      )
                      before = {}
                      for table in order_tables:
                          cursor.execute(f"SELECT COUNT(*) FROM {table}")
                          before[table] = int(cursor.fetchone()[0])

                      preserved_before = {}
                      for table in preserved_tables:
                          cursor.execute(f"SELECT COUNT(*) FROM {table}")
                          preserved_before[table] = int(cursor.fetchone()[0])

                      for table in order_tables:
                          cursor.execute(f"DELETE FROM {table}")

                      after = {}
                      for table in order_tables:
                          cursor.execute(f"SELECT COUNT(*) FROM {table}")
                          after[table] = int(cursor.fetchone()[0])
                      if any(after.values()):
                          raise RuntimeError(f"order reset verification failed: {after}")

                      preserved_after = {}
                      for table in preserved_tables:
                          cursor.execute(f"SELECT COUNT(*) FROM {table}")
                          preserved_after[table] = int(cursor.fetchone()[0])
                      if preserved_after != preserved_before:
                          raise RuntimeError("preserved table counts changed")

                      cursor.execute(
                          """
                          INSERT INTO gpm_app_audit_log(
                              event_id, occurred_at, actor_account_id,
                              actor_username, event_type, outcome,
                              target_type, target_id, details
                          ) VALUES (%s, %s, NULL, %s, %s, %s, %s, %s, %s::jsonb)
                          """,
                          (
                              str(uuid4()),
                              datetime.now(timezone.utc),
                              "github-actions",
                              "production_order_data_reset",
                              "success",
                              "system",
                              "gpm_order_domain",
                              json.dumps(
                                  {
                                      "deleted_rows": before,
                                      "backup_file": backup_file,
                                      "preserved_rows": preserved_after,
                                  },
                                  ensure_ascii=False,
                              ),
                          ),
                      )

              with connection.cursor() as cursor:
                  verified = {}
                  for table in order_tables:
                      cursor.execute(f"SELECT COUNT(*) FROM {table}")
                      verified[table] = int(cursor.fetchone()[0])
                  if any(verified.values()):
                      raise RuntimeError(f"post-commit verification failed: {verified}")

              print(
                  json.dumps(
                      {
                          "backup_file": backup_file,
                          "deleted_rows": before,
                          "remaining_order_rows": verified,
                          "preserved_rows": preserved_after,
                      },
                      ensure_ascii=False,
                      sort_keys=True,
                  )
              )
          finally:
              connection.close()
          PY

          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://app-api.gpmbot.ru/health
          REMOTE
