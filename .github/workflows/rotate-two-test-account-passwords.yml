name: Rotate two GPM test account passwords

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-account-maintenance
  cancel-in-progress: false

env:
  BACKEND_HOST: 46.149.71.147
  SSH_USER: root

jobs:
  rotate-passwords:
    name: Rotate and verify account passwords
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10

    steps:
      - name: Require a main-branch dispatch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: exit 1

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create protected credential payload
        shell: bash
        env:
          LOGIST_PASSWORD: ${{ secrets.GPM_TEMP_LOGIST_PASSWORD }}
          WORKER_PASSWORD: ${{ secrets.GPM_TEMP_WORKER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$LOGIST_PASSWORD"
          test -n "$WORKER_PASSWORD"
          umask 077
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "accounts": [
                  {
                      "username": "gpm-logist-021026-01",
                      "password": os.environ["LOGIST_PASSWORD"],
                      "role": "logist",
                  },
                  {
                      "username": "gpm-worker-spb-021026-01",
                      "password": os.environ["WORKER_PASSWORD"],
                      "role": "worker",
                  },
              ]
          }
          target = Path("/tmp/gpm-rotate-two-passwords.json")
          target.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          target.chmod(0o600)
          PY

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Rotate passwords with backup and verification
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PAYLOAD=/root/.gpm-rotate-two-passwords-${GITHUB_RUN_ID}.json
          scp -o BatchMode=yes -o ConnectTimeout=15 \
            /tmp/gpm-rotate-two-passwords.json \
            "${SSH_USER}@${BACKEND_HOST}:${REMOTE_PAYLOAD}"
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "${SSH_USER}@${BACKEND_HOST}" \
            "CREDENTIAL_FILE='${REMOTE_PAYLOAD}' bash -se" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$CREDENTIAL_FILE"' EXIT
          chmod 600 "$CREDENTIAL_FILE"
          cd /opt/gpm/gpm_platform
          test -x .venv/bin/python
          set -a
          . /root/gpm-app-env
          set +a

          STAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DIR="/opt/gpm/backups/password-rotation-${STAMP}"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          pg_dump --format=custom --file="$BACKUP_DIR/gpm-app-before-password-rotation.dump" \
            "$GPM_APP_DATABASE_URL"
          pg_restore --list "$BACKUP_DIR/gpm-app-before-password-rotation.dump" >/dev/null

          CREDENTIAL_FILE="$CREDENTIAL_FILE" .venv/bin/python - <<'PY'
          import json
          import os

          from app import app_orders_api as api

          with open(os.environ["CREDENTIAL_FILE"], encoding="utf-8") as source:
              requested = json.load(source)["accounts"]

          api.validate_runtime_configuration()
          api.init_db()
          with api.db_connection() as connection:
              if api._is_sqlite_connection(connection):
                  raise RuntimeError("production password rotation requires PostgreSQL")
              with connection.cursor() as cursor:
                  for item in requested:
                      username = item["username"]
                      role = item["role"]
                      password = item["password"]
                      api.validate_new_password(password, username)
                      cursor.execute(
                          f"""
                          SELECT account_id, role
                          FROM {api.ACCOUNTS_TABLE_NAME}
                          WHERE username_normalized = %s
                          FOR UPDATE
                          """,
                          (api.normalize_username(username),),
                      )
                      row = cursor.fetchone()
                      if row is None or str(row[1]) != role:
                          raise RuntimeError(f"account or role mismatch for {username}")
                      account_id = str(row[0])
                      cursor.execute(
                          f"""
                          UPDATE {api.ACCOUNTS_TABLE_NAME}
                          SET password_hash = %s, token_version = token_version + 1,
                              failed_login_count = 0, locked_until = NULL,
                              updated_at = NOW()
                          WHERE account_id = %s
                          """,
                          (api.hash_password(password), account_id),
                      )
                      cursor.execute(
                          f"""
                          UPDATE {api.SESSIONS_TABLE_NAME}
                          SET revoked_at = COALESCE(revoked_at, NOW())
                          WHERE account_id = %s AND revoked_at IS NULL
                          """,
                          (account_id,),
                      )
                      api.record_audit_event_in_connection(
                          connection,
                          event_type="password_rotated",
                          outcome="success",
                          actor_username="project-owner-account-maintenance",
                          target_type="account",
                          target_id=account_id,
                          details={"reason": "credential_generation_remediation"},
                      )
              connection.commit()

          for item in requested:
              session = api.check_app_credentials(item["username"], item["password"])
              if session["role"] != item["role"]:
                  raise RuntimeError(f"credential verification failed for {item['username']}")
              user = api.current_user("Bearer " + session["access_token"])
              api.revoke_session(
                  user,
                  audit_details={"source": "password_rotation_verification"},
              )
              print(
                  f"rotated_and_verified role={item['role']} "
                  f"username={item['username']}"
              )
          PY
          echo "Verified backup: $BACKUP_DIR/gpm-app-before-password-rotation.dump"
          REMOTE

      - name: Remove runner credential payload
        if: always()
        shell: bash
        run: rm -f /tmp/gpm-rotate-two-passwords.json
