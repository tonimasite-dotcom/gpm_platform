name: Worker identity test sync QA
on:
  workflow_dispatch:
  push:
    branches: [work/worker-identity-link-2026-11-23]
permissions:
  contents: read
jobs:
  matching:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: find integrations/workstaff-test-crm/worker-link -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: php integrations/workstaff-test-crm/worker-link/test_policy.php
      - run: php integrations/workstaff-test-crm/worker-link/test_preview_policy.php
      - run: php integrations/workstaff-test-crm/worker-link/test_preview_service.php
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-api.lock
      - run: python -m pip install --disable-pip-version-check -r requirements-api.lock
      - run: python -m unittest tests.test_registration_preview tests.test_registration_preview_crm tests.test_preview_deploy_flags -v
      - name: Check deployment shell scripts
        run: |
          python - <<'PY'
          import subprocess, yaml
          data = yaml.safe_load(open('.github/workflows/deploy-production.yml'))
          for job in data['jobs'].values():
              for step in job['steps']:
                  if 'run' in step:
                      subprocess.run(['bash', '-n'], input=step['run'], text=True, check=True)
          PY
